# One line per company: name, ATS type, board URL (and optional notes).
# Adding a company = add one entry here.
# ats: workday | comeet | greenhouse | lever | smartrecruiters
# blocked: true = the careers site refuses automated requests from the scan servers.
#   RADAR does not fetch it; the dashboard links board_url under "Check yourself".
#   Their roles usually still arrive through LinkedIn.
#
# NOT added (no usable public API / job feed):
# - Israel Aerospace Industries: Greenhouse board "iai" is UK i.AI, not IAI Israel.
# - Stratasys: SuccessFactors; SmartRecruiters API empty; no public job RSS/XML.
# - Tower Semiconductor: SuccessFactors; site RSS is PR/news, not jobs.
# - DustPhotonics, Teva, Magenta, Elbit, Valens, Mobileye: no public ATS API found.
# Jooble: skipped (500 lifetime free requests — too few for daily runs).

companies:
